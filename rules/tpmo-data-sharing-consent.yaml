code: tpmo-data-sharing-consent
title: TPMO-to-TPMO sharing of beneficiary data needs prior express written consent, one recipient at a time
regulator: CMS
citation: 42 CFR 422.2274(g)(4); 423.2274(g)(4)
applies_to: [MA, PDP]
summary: >
  A TPMO may pass beneficiary data collected for marketing or enrollment to
  another TPMO only with the beneficiary's prior express written consent, given
  through a disclosure that lists each recipient and lets the beneficiary accept
  or reject each one. Challenged in the same case that vacated the CY2025
  compensation rewrite; this paragraph was left in place. Pair it with
  tcpa-pewc-one-to-one: the FCC's similar one-to-one consent rule was vacated.
  Similar ideas, different regulators, opposite outcomes.
# Rule-level source_url is left empty on purpose: the source watcher needs a frozen
# snapshot of every rule-level URL (fixtures/sources/), and none is committed yet.
# Primary sources, with URLs, are on each version.
source_url: ""
versions:
  - version: 1
    status: in_force
    effective_from: 2024-10-01
    effective_to: null
    change_classification: INITIAL
    clause_text: >
      [eCFR 42 CFR 422.2274(g)(4), 2026-09-23, quoted] "Beginning October 1, 2024,
      personal beneficiary data collected by a TPMO for marketing or enrolling them
      into an MA plan may only be shared with another TPMO when prior express
      written consent is given by the beneficiary. Prior express written consent
      from the beneficiary to share the data and be contacted for marketing or
      enrollment purposes must be obtained through a clear and conspicuous
      disclosure that lists each entity receiving the data and allows the
      beneficiary to consent or reject to the sharing of their data with each
      individual TPMO."
    summary: >
      In force since 2024-10-01. A blanket "our partners" consent, or a link-out
      partner list without a choice per partner, does not meet it.
    params:
      per_recipient_consent: true
      recipients_must_be_listed: true
      blanket_partner_consent: prohibited
