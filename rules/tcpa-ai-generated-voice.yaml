code: tcpa-ai-generated-voice
title: TCPA — an AI-generated voice is an "artificial or prerecorded voice" (FCC 24-17); AI-call disclosure proposed (FCC 24-84)
regulator: FCC
citation: 47 U.S.C. 227(b)(1); 47 CFR 64.1200(a)(1)-(3), (b)(1)-(3); FCC 24-17 (CG Docket No. 23-362)
applies_to: [MA, PDP, MEDIGAP, LIFE]
summary: >
  The FCC confirmed in February 2024 that the TCPA's limits on calls using an
  "artificial or prerecorded voice" cover AI technologies that generate human
  voices, including voice cloning. An outbound call placed with an AI voice
  therefore needs the called party's prior express consent, and prior express
  written consent when it markets or sells; the message must identify the
  caller at the start, give a call-back number, and, for telemarketing, offer
  an automated opt-out. A live agent choosing what the AI voice says does not
  take the call outside the rule. The ruling is about calls an AI voice
  initiates; it does not address an AI voice answering inbound calls. A
  separate proposal (FCC 24-84) would add an AI disclosure at consent and at
  the start of each call; it has not been adopted. Nothing in EIP's public
  footprint confirms an outbound voice-AI deployment (assumptions ledger E4:
  unknown); this rule matters the day one is piloted.
# Questions for counsel, not answered here (so the version is not marked disputed):
#  - Whether an AI voice agent that answers an inbound call and later places a
#    callback or warm transfer "initiates" a call with an artificial voice.
#  - Whether Fla. Stat. 501.059(8)(a) ("the playing of a recorded message")
#    reaches a synthetic voice generated live.
#  - Which CMS agent-only activities (plan-specific discussion, enrollment) an
#    AI voice may perform at all; this rule does not decide that.
# Rule-level source_url is left empty on purpose: the source watcher needs a frozen
# snapshot of every rule-level URL (fixtures/sources/), and none is committed yet.
# Primary sources, with URLs, are on each version.
source_url: ""
versions:
  - version: 1
    status: in_force
    # FCC 24-17 para. 11: "effective upon release"; released 2024-02-08
    # (adopted 2024-02-02). A declaratory ruling reads the existing rule; it
    # did not change the text of 64.1200.
    effective_from: 2024-02-08
    effective_to: null
    change_classification: INITIAL
    clause_text: >
      [FCC 24-17 para. 2, quoted] "we confirm that the TCPA's restrictions on the
      use of 'artificial or prerecorded voice' encompass current AI technologies
      that generate human voices." [para. 5, paraphrase] Callers must obtain
      prior express consent before a call that uses an artificial or prerecorded
      voice simulated or generated through AI; voice cloning is covered.
      [n. 13, paraphrase] If the call introduces an advertisement or is
      telemarketing, prior express written consent is required (64.1200(a)(2),
      (3)). [para. 8, paraphrase] A live agent selecting the messages does not
      remove the call from the prohibition. [para. 9, paraphrase] The
      identification, disclosure and opt-out requirements of 64.1200(b) apply to
      "any AI technology that initiates any outbound telephone call using an
      artificial or prerecorded voice to consumers." [47 CFR 64.1200(b)(1),
      quoted] "At the beginning of the message, state clearly the identity of the
      business, individual, or other entity that is responsible for initiating
      the call." [64.1200(b)(3), paraphrase] Telemarketing messages provide an
      automated voice or key-press opt-out, with instructions, within two seconds
      of the identification; using it records the number on the caller's
      do-not-call list and ends the call.
    summary: >
      In force since 2024-02-08. An outbound AI-voice call is a robocall: consent
      first (written consent for sales and marketing), identify the caller at the
      start, give a call-back number, offer an automated opt-out on
      telemarketing calls.
    params:
      synthetic_voice_is_artificial_voice: true
      live_agent_selecting_messages_exempts: false
      consent_required: prior_express_consent
      consent_required_if_telemarketing: prior_express_written_consent
      identify_caller_at_start: true
      callback_number_required: true
      automated_opt_out_within_seconds: 2
      scope: outbound_calls_initiated
      ai_disclosure_required: false
    sources:
      - authority: primary
        cite: "FCC 24-17, Declaratory Ruling, CG Docket No. 23-362 (adopted 2024-02-02, released 2024-02-08), paras. 2, 5, 8, 9, 11"
        url: https://docs.fcc.gov/public/attachments/FCC-24-17A1.pdf
      - authority: primary
        cite: "eCFR 47 CFR 64.1200(a)(2)-(3), (b)(1)-(3), (f)(9), read 2026-09-30 (up to date as of 2026-09-25)"
        url: https://www.ecfr.gov/current/title-47/section-64.1200
    git_commit: seed
  - version: 2
    status: proposed
    # Comments closed 2024-10-25. No final rule in the Federal Register as of
    # 2026-09-30 (FR search of the docket title returns the NPRM and Unified
    # Agenda entries only). No vote is scheduled, so there is no vote_date.
    effective_from: null
    effective_to: null
    change_classification: ADDS_REQUIREMENT
    clause_text: >
      [paraphrase of the proposed rule text, FCC 24-84, 89 FR 73321] Define an
      "AI-generated call" as an outbound call that uses computational technology
      or machine learning, including predictive algorithms and large language
      models, to produce voice or text content (proposed 64.1200(f)(20)). When
      obtaining consent, callers must clearly and conspicuously disclose that
      they intend to use AI-generated voice or text (proposed (a)(13)); written
      consent for AI-generated calls must say so and the signer must
      specifically agree (proposed (f)(9)(i)(C)). Each artificial or prerecorded
      voice message must disclose at the beginning whether the call uses an AI
      voice (proposed (b)(1)). Calls by people with speech or hearing
      disabilities using AI voice technology, with no telemarketing, would be
      exempt (proposed (a)(3)(vi), (a)(9)(v)).
    summary: >
      Proposed 2024-08-08 (published 2024-09-10). Not law. If adopted, existing
      consent language on lead forms would need an AI disclosure before an AI
      voice could call on it.
    params:
      ai_disclosure_at_consent: true
      ai_disclosure_at_call_start: true
      written_consent_must_name_ai: true
      disability_exemption_non_telemarketing: true
