  - code: mfaq-home
    name: MedicareFAQ — home
    url: https://www.medicarefaq.com/
    source_system: vercel
    owner_role: marketing
  - code: mfaq-about
    name: MedicareFAQ — About Us
    url: https://www.medicarefaq.com/about-us/
    source_system: vercel
    owner_role: marketing
  - code: mfaq-soa
    name: MedicareFAQ — Scope of Appointment FAQ
