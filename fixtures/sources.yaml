# Artifact inventory scanned by Backstop.
#
# Two kinds of artifact, and the difference is labeled in the data, not in a
# slide footnote:
#   real:      public EIP-operated web pages, fetched read-only with an
#              identified user agent, frozen to fixtures/pages/<code>.html so the
#              demo never depends on the live network.
#   synthetic: stand-ins for internal artifacts (Attention scorecard items,
#              agent scripts, coaching prompts, SFMC templates, training slides,
#              IVR lines) written in the same schema an integration would use.
#              Nothing here is EIP's actual internal content.

