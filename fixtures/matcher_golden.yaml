# Labeled snippets for evaluating the deterministic matchers.
#
# Each case is a short text and the set of (rule, version) edges a careful
# compliance analyst would draw from it. `expect: []` means "no edge" — those
# are the near-misses that measure false positives. Confirmed and proposed
# edges both count as detections; the report breaks them out.
#
# Run: `backstop eval-matchers` → docs/eval-report.md and GET /api/evals/matchers

cases:
  # ---------------------------------------------------------------- soa-48h-wait (v1)
  - id: soa-01
    text: "A Scope of Appointment must be documented at least 48 hours before any personal marketing appointment."
    expect: [{rule: soa-48h-wait, version: 1}]
  - id: soa-02
    text: "Score 0 if the appointment is booked inside the 48-hour window unless the customer is a walk-in."
    # Since 2026-09-25 the walk-in exception is also a proposed reading of the SOA scope rule.
    expect: [{rule: soa-48h-wait, version: 1}, {rule: soa-all-personal-marketing-appointments, version: 1, status: proposed}]
  - id: soa-03
    text: "As required by CMS, your appointment is scheduled at least 48 hours after your signed Scope of Appointment."
    expect: [{rule: soa-48h-wait, version: 1}]
  - id: soa-04
    text: "Once you've signed the SOA, we'll need to wait two business days before we can meet."
    expect: [{rule: soa-48h-wait, version: 1}]
  - id: soa-05
    text: "CMS guidelines traditionally suggest a 48-hour advance window for the Scope of Appointment."
    expect: [{rule: soa-48h-wait, version: 1}]
  - id: soa-06-near-miss
    text: "Call us within 48 hours for a free quote on Plan G."
    expect: []
  - id: soa-07-near-miss
    text: "Your ID card arrives within two business days of enrollment."
    expect: []
  - id: soa-08-near-miss
    text: "The Scope of Appointment form lists which plan types the agent may discuss."
    expect: []
  - id: soa-09-near-miss
    text: "Forty-eight hours after the storm, the office reopened for appointments with existing clients."
    expect: [{rule: soa-48h-wait, version: 1}]   # known limitation: 'appointments' context triggers; documented FP

