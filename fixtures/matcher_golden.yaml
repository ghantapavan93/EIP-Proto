  # ---------------------------------------------------------------- real quotes, EIP public estate (r1, fetched 2026-09-25)
  # Verbatim from medicarefaq.com and theelitebrokerage.com. Where no encoded rule covers a
  # quote, the case expects no edge, is marked known_limitation, and `gap` names what is missing.
  - id: r1-q01
    text: "Scope of appointment confirmation: written or recorded verbal agreement is required before discussing specific products"
    expect: []
    known_limitation: true
    gap: "Misdescribes the CY2027 changes by omission; no version-specific wording to bind. Needs a 'regulatory-description accuracy' rule (LLM proposal + human review), not a regex."
  - id: r1-q02
    text: "Recording and documentation requirements: certain calls must be recorded or logged for compliance review"
    expect: []
    known_limitation: true
    gap: "Mentions recording but no retention period, so it binds to neither v1 (10 years) nor v2 (6 years)."
  - id: r1-q03
    text: "CMS Required Disclosure We do not offer every plan available in your area. Any information we provide is limited to those plans we do offer in your area. Please contact Medicare.gov or 1-800-MEDICARE to get information on all of your options."
    expect: [{rule: tpmo-disclaimer-text, version: 2, status: proposed}]   # was a false green (v2 confirmed)
  - id: r1-q04
    text: "Our agents are contracted with every major carrier in Hillsborough County and can compare all 58 Medicare Advantage plans, Medigap policies, and Part D options at no cost to you."
    expect: []
    known_limitation: true
    gap: "Contradicts the page's own 'we do not offer every plan' disclaimer. Needs an 'all-plans claim vs disclaimer' rule."
  - id: r1-q05
    text: "Humana Walmart Value Rx stands out for offering $0 copays on both Tier 1 and Tier 2 drugs at preferred pharmacies, a benefit no other major national plan matches."
    expect: [{rule: superlatives, version: 2, status: proposed}]
  - id: r1-q06
    text: "Largest formulary among major national Part D plans"
    expect: [{rule: superlatives, version: 2, status: proposed}]
  - id: r1-q07
    text: "The $2,000 annual Part D out-of-pocket cap continues in 2027, making formulary verification even more valuable for high-cost medications."
    expect: []
    known_limitation: true
    gap: "Wrong program parameter (the 2027 cap is $2,400). Needs a 'program parameters by plan year' rule."
  - id: r1-q08
    text: "Part D Maximum Out-of-Pocket $2,000 New cap effective 2025; includes the Medicare Prescription Payment Plan option"
    expect: []
    known_limitation: true
    gap: "Stale program parameter in a 2026 table. Needs a 'program parameters by plan year' rule."
  - id: r1-q09
    text: "Broad preferred pharmacy network. Gap coverage on generics."
    expect: []
    known_limitation: true
    gap: "The coverage gap ended in 2025. Needs a plan-year fact rule."
  - id: r1-q10
    text: "For 2026, the standard monthly premium is $202.90, up from $202.90 in 2025."
    expect: []
    known_limitation: true
    gap: "The 2025 Part B premium was $185. Needs a 'program parameters by plan year' rule."
  - id: r1-q11
    text: "Licensed in All 50 States BBB A+ Rated 1,000,000+ Clients Helped"
    expect: [{rule: eip-licensing-footprint, version: 2, status: confirmed}]
  - id: r1-q12
    text: "With over 50,000 clients served in 50 states over the last nine years, we offer a proven track record"
    expect: [{rule: eip-licensing-footprint, version: 2, status: proposed}]   # clients served, not licensing: a human decides
  - id: r1-q13
    text: "This website is not connected with the federal government or the federal Medicare program. Please contact medicare.gov or 1-800-MEDICARE or your local State Health Insurance Program to get information on all of your options."
    expect: [{rule: tpmo-disclaimer-text, version: 1, status: confirmed}]
  - id: r1-q14
    text: "Top-level contracts with the highest paid commissions Co-Op money"
    expect: []
    known_limitation: true
    gap: "Agent-facing compensation claim (FMV caps), not a beneficiary superlative. Needs a compensation rule and counsel."
  - id: r1-q15
    text: "Once your agency meets its goals, we automatically move you up to the next contract level, until you reach the top."
    expect: []
    known_limitation: true
    gap: "Production-tiered contract levels. No encoded rule; verify with counsel."
  - id: r1-q16
    text: "2024 AHIP Medicare Training AHIP Certification"
    expect: []
    known_limitation: true
    gap: "Certification two plan years stale. Needs a 'certification plan-year freshness' rule."
  - id: r1-q17
    text: "Our licensed Medicare agents provide free, unbiased guidance. We are compensated by insurance carriers, not by you."
    expect: []
    known_limitation: true
    gap: "'Unbiased' from a commission-paid TPMO that does not offer every plan. No encoded misleading-claims rule."
  - id: r1-q18
    text: "Because CMS standardizes commission rates, a broker has no financial reason to steer you toward one carrier over another."
    expect: []
    known_limitation: true
    gap: "Overstates CMS commission rules (CMS sets a maximum, not a standard rate). agent-broker-compensation is now encoded, but its matchers look for CY2027 cap amounts and vacated administrative-payment language, not claims about what the caps mean."
  - id: r1-q19
    text: "Tampa (Hillsborough County) has 58 Medicare Advantage plans available in 2026, with 52 offering $0 monthly premiums and 74% rated 4 stars or higher by CMS"
    expect: []
    known_limitation: true
    gap: "Plan-year 2026 data on a page aimed at AEP 2027. Needs a 'plan-year freshness' rule."
  - id: r1-q20
    text: "Our licensed agents can review your current coverage, check your drug formulary, and help you find the best plan for 2027 at no cost to you."
    expect: []
    known_limitation: true
    gap: "Soft superlative in a service description. Deliberately not flagged: 'help you find the best plan' is excluded to keep false positives low (see sup-09-near-miss)."

