# The single public entry point: static UI + same-origin /api proxy.
# A Cloudflare Quick Tunnel forwards https://<random>.trycloudflare.com here;
# Postgres, the API port and Ollama are never exposed.

# Behind cloudflared every request arrives from the tunnel's local address, so key
# the limit on Cloudflare's client-IP header when present (spoofable only by
# someone who can already reach 127.0.0.1, which is this machine).
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_key zone=api_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;   # matches the API's ingest cap

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown;

    # Security headers live in one file: nginx drops server-level add_header in any
    # location that sets its own, so every location includes the snippet.
    include /etc/nginx/snippets/security-headers.conf;

    # Single-page app: unknown paths resolve to index.html; hashed assets cache hard.
    # The HTML shell must revalidate, or a redeploy never reaches a viewer who
    # already opened the link; hashed /assets/ files below cache for a year.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same-origin API; the browser never learns the API container's address.
    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
